<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <!-- Sleek Circular Glow Badge -->
  <circle cx="64" cy="64" r="58" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="5" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="64" cy="64" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Bold Crisp White DRX Logo Text -->
  <text x="64" y="78" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-1.5">DRX</text>
  
  <!-- Cyan Accent Diamond Dot -->
  <circle cx="98" cy="36" r="6" fill="#38bdf8" />
</svg>
